<!DOCTYPE html>
<html>

<head>
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="styles/10-rock-paper-scissors.css">
</head>

<body>
    <h1>Rock Paper Scissors</h1>
    <button class="move-button" onclick="
        result('rock');
        "><img src="images/rock-emoji.png"></button>
    <button class="move-button" onclick="
        result('paper');
        "><img src="images/paper-emoji.png"></button>
    <button class="move-button" onclick="
        result('scissors');
        "><img src="images/scissors-emoji.png"></button>

    <p class="js-moves"></p>

    <p class="js-result result"></p>

    <p class="js-score"></p>

    <button class="reset-button" onclick="
        score.wins = 0;
        score.loses = 0;
        score.ties = 0;
        localStorage.removeItem('score');
        updatedScore();
        ">Reset Score</button>

    <script src="scripts/10-rock-paper-scissors.js"></script>
</body>

</html>

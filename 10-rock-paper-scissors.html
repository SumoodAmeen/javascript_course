<!DOCTYPE html>
<html>

<head>
    <title>Rock Paper Scissors</title>
    <style>
        body {
            background-color : black;
        }

        h1 {
            color : white;
            font-family : Arial;
        }

        p {
            color : white;
            font-family : Arial;
            font-size : 17px;
        }

        .reset-button {
            color : black;
            font-size : 15px;
            border : none;
            background-color : white;
            padding : 7px 13px;
            
        }

        .move-button {
            border : 2px solid white;
            border-radius : 100%;
            padding : 20px;
            background-color : transparent;
            margin-right : 5px;
            
        }

        img {
            height : 70px;
            
        }
    </style>
</head>

<body>
    <h1>Rock Paper Scissors</h1>
    <button class="move-button" onclick="
        result('rock');
        "><img src="rock-emoji.png"></button>
    <button class="move-button" onclick="
        result('paper');
        "><img src="paper-emoji.png"></button>
    <button class="move-button" onclick="
        result('scissor');
        "><img src="scissors-emoji.png"></button>

    <p class="js-moves"></p>

    <p class="js-result"></p>

    <p class="js-score"></p>

    <button class="reset-button" onclick="
        score.wins = 0;
        score.loses = 0;
        score.ties = 0;
        localStorage.removeItem('score');
        updatedScore();
        ">Reset Score</button>

    <script>

        let score = JSON.parse(localStorage.getItem('score')) || { wins: 0, loses: 0, ties: 0 };


        updatedScore();



        /*if (score === null){
            score = {
                wins:0,
                loses:0,
                ties:0
            }
        }*/

        function pickComputerMove() {
            let randomNumber = Math.random();

            if (randomNumber > 0 && randomNumber < 1 / 3) {
                computerMove = 'rock';
            }
            else if (randomNumber >= 1 / 3 && randomNumber < 2 / 3) {
                computerMove = 'paper';
            }
            else if (randomNumber >= 2 / 3 && randomNumber < 1) {
                computerMove = 'scissors';
            }

            return computerMove;
        }

        function result(userMove) {
            const computerMove = pickComputerMove();
            let result1 = '';

            if (userMove === 'rock') {
                if (computerMove === 'rock') {
                    result1 = 'tie';
                }
                else if (computerMove === 'paper') {
                    result1 = 'lose';
                }
                else if (computerMove === 'scissors') {
                    result1 = 'win';
                }
            }
            else if (userMove === 'paper') {
                if (computerMove === 'rock') {
                    result1 = 'win';
                }
                else if (computerMove === 'paper') {
                    result1 = 'tie';
                }
                else if (computerMove === 'scissors') {
                    result1 = 'lose';
                }
            }
            else if (userMove === 'scissor') {
                if (computerMove === 'rock') {
                    result1 = 'lose';
                }
                else if (computerMove === 'paper') {
                    result1 = 'win';
                }
                else if (computerMove === 'scissors') {
                    result1 = 'tie';
                }
            }

            if (result1 === 'win') {
                score.wins += 1;
            }
            else if (result1 === 'lose') {
                score.loses += 1;
            }
            else if (result1 === 'tie') {
                score.ties += 1;
            }

            localStorage.setItem('score', JSON.stringify(score));  //we store the score as string, because local storage only supports

            updatedScore();

            document.querySelector('.js-result').innerHTML = `You ${result1}`;

            document.querySelector('.js-moves').innerHTML = `Computer picked ${computerMove}. User picked ${userMove}.`;

        }

        function updatedScore() {
            document.querySelector('.js-score').innerHTML = `Wins : ${score.wins}, Loses : ${score.loses}, Ties : ${score.ties}`;
        }
    </script>
</body>

</html>

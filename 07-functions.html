<!DOCTYPE html>
<html>
    <head>
        <title>Functions</title>
    </head>
    <body>


        <script>
            function function1() {
                console.log('Hi all.');
                console.log(2+2);
            }

            function1();

            function function2() {
                return 5;
            }

            console.log(function2());


            function function3(parameter1){
                console.log(parameter1 * 0.1);
            }

            function3(1000);
            function3(3000);

            function taxCalculation(cost, taxPercent){
                console.log(cost*taxPercent);
            }

            taxCalculation(2000,0.2);
        </script>
    </body>
</html>

<!DOCTYPE html>
<html>

<head>
    <title>Objects</title>
</head>

<body>

    <script>
        const product = {name : 'socks', price : 1050 };
        console.log(product);
        console.log(product.name);
        console.log(product.price);

        console.log(localStorage.getItem('message'));

        product.name = 'cotton socks';
        console.log(product.name);

        product.newProperty = true;
        console.log(product);

        delete product.newProperty;
        console.log(product);

        const product2 = {
            name: 'shirt',
            ['delivery-time']:'1 day',
            rating: {star: 4.5, count:9},
            fun: function function1(){
                console.log('this is function inside an object');
            }
        }
        console.log(product2);
        console.log(product2['name']);
        console.log(product2.rating);
        console.log(product2.rating.star);
        product2.fun();

        console.log(JSON.stringify(product2));

        const JSONString = JSON.stringify(product2);

        console.log(JSON.parse(JSONString));


        function localStorageTest(){
            console.log('This is a sample string');

            localStorage.setItem('message', 'hello');
        }


        localStorageTest();


        console.log('hello'.length);
        console.log('hello'.toUpperCase());

        const object1 = {
            message:'hello'
        };

        const object2 = object1;

        object1.message = 'good job!';
        console.log(object1);
        console.log(object2);

        const object3 = {
            message : 'good job!'
        };

        console.log(object1 === object3);
        console.log(object1 === object2);

        const object4 = {
            message: 'good job!',
        };

        //const message = object4.message;
        const {message} = object4;
        console.log(message);

        const object5 = {
            message1 : 'Good job!',
            price : 799,
        };

        const {message1, price} = object5;
        console.log(message);
        console.log(price);

        const object6 = {
            //message : message
            message,
            /*method : function func() {
                console.log('method');
            },*/
            method() {
                console.log('method');
            },
        };
        console.log(object6);
        object6.method();



        


    </script>
</body>

</html>

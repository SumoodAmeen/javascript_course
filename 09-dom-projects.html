<!DOCTYPE html>
<html>

<head>
    <title>DOM Projects</title>
</head>

<body>
    <p>Youtube Subscribe Button</p>
    <button class="js-subscribe-button" onclick="
        subscribe();
        ">
        Subscribe
    </button>
    <script>
        function subscribe() {
            let text = document.querySelector('.js-subscribe-button');
            console.log(text);
            if (text.innerText === 'Subscribe') {
                text.innerText = 'Subscribed'
            }
            else if (text.innerText === 'Subscribed') {
                text.innerText = 'Subscribe'
            }
        }

    </script>
</body>

</html>

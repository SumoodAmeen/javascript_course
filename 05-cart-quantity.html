<!DOCTYPE html>
<html>
    <head>
        <title>Cart Quantity</title>
    </head>
    <body>
        <h1>Cart Quantity</h1>
        <button onclick="console.log(`Cart Quantity = ${result}`);">Show Quantity</button>
        <button onclick="result = result+1;">Add to Cart</button>
        <button onclick="result = result+2;">+2</button>
        <button onclick="result += 3;">+3</button>
        <button onclick="result = 0;
            console.log(`Cart Quantity = ${result}`);"
        >Reset Cart</button>

        <script>
            let result = 0;

        </script>
    </body>
</html>

<!DOCTYPE html>
<html>

<head>
    <title>Rock Paper Scissors</title>
</head>

<body>
    <h1>Rock Paper Scissors</h1>
    <button onclick="
        result('rock');
        ">rock</button>
    <button onclick="
        result('paper');
        ">paper</button>
    <button onclick="
        result('scissor');
        ">scissors</button>
    <button onclick="
        score.wins = 0;
        score.loses = 0;
        score.ties = 0;
        ">Reset</button>

    <script>

        const score = {wins: 0, loses: 0, ties: 0};

        function pickComputerMove() {
            let randomNumber = Math.random();

            if (randomNumber > 0 && randomNumber < 1 / 3) {
                computerMove = 'rock';
            }
            else if (randomNumber >= 1 / 3 && randomNumber < 2 / 3) {
                computerMove = 'paper';
            }
            else if (randomNumber >= 2 / 3 && randomNumber < 1) {
                computerMove = 'scissors';
            }

            return computerMove;
        }

        function result(userMove) {
            const computerMove = pickComputerMove();
            let result1 = '';

            if (userMove === 'rock') {
                if (computerMove === 'rock') {
                    result1 = 'tie';
                }
                else if (computerMove === 'paper') {
                    result1 = 'lose';
                }
                else if (computerMove === 'scissors') {
                    result1 = 'win';
                }
            }
            else if (userMove === 'paper') {
                if (computerMove === 'rock') {
                    result1 = 'win';
                }
                else if (computerMove === 'paper') {
                    result1 = 'tie';
                }
                else if (computerMove === 'scissors') {
                    result1 = 'lose';
                }
            }
            else if (userMove === 'scissor') {
                if (computerMove === 'rock') {
                    result1 = 'lose';
                }
                else if (computerMove === 'paper') {
                    result1 = 'win';
                }
                else if (computerMove === 'scissors') {
                    result1 = 'tie';
                }
            }

            if (result1 === 'win') {
                score.wins +=1;
            }
            else if (result1 === 'lose') {
                score.loses +=1;
            }
            else if (result1 === 'tie') {
                score.ties +=1;
            }

            alert(`Computer picked ${computerMove}. User picked ${userMove}. So it is a ${result1}, 
            Wins : ${score.wins}, Loses : ${score.loses}, Ties : ${score.ties}`);

        }
    </script>
</body>

</html>

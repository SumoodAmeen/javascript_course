<!DOCTYPE html>
<html>
    <head>
        <title>Rock Paper Scissors</title>
    </head>
    <body>

        <h1>Rock Paper Scissors</h1>
        <button onclick="
        const computerMove = pickComputerMove();

        if (computerMove === 'rock'){
            alert(`You picked rock. Computer picked ${computerMove}. So it is a draw.` );
        }
        else if (computerMove === 'paper'){
            alert(`You picked rock. Computer picked ${computerMove}. So you loose.` );
        }
        else if(computerMove === 'scissors'){
            alert(`You picked rock. Computer picked ${computerMove}. So you win.` );
        }
        ">Rock</button>
        <button onclick="
        const computerMove = pickComputerMove();

        if (computerMove === 'rock'){
            alert(`You picked paper. Computer picked ${computerMove}. So you win.` );
        }
        else if (computerMove === 'paper'){
            alert(`You picked paper. Computer picked ${computerMove}. So it is a draw.` );
        }
        else if(computerMove === 'scissors'){
            alert(`You picked paper. Computer picked ${computerMove}. So you lose.` );
        }
        ">Paper</button>
        <button onclick="
        const computerMove = pickComputerMove();

        if (computerMove === 'rock'){
            alert(`You picked scissors. Computer picked ${computerMove}. So you lose.` );
        }
        else if (computerMove === 'paper'){
            alert(`You picked scissors. Computer picked ${computerMove}. So you win.` );
        }
        else if(computerMove === 'scissors'){
            alert(`You picked scissors. Computer picked ${computerMove}. So it is a draw.` );
        }
        ">Scissors</button>


        <script>

            function pickComputerMove(){
                let computerMove = '';
                const randomNumber = Math.random();
                if (randomNumber > 0 && randomNumber < 1/3){
                    computerMove = 'rock';
                }
                else if (randomNumber >= 1/3 && randomNumber < 2/3){
                    computerMove = 'paper';
                }
                else if (randomNumber >= 2/3 && randomNumber < 1){
                    computerMove = 'scissors';
                }

                return computerMove;
            }
        </script>
    </body>
</html>

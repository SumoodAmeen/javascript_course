<!DOCTYPE html>
<html>
    <head>
        <title>Arrays and Loops</title>
    </head>
    <body>
        <h1>Arrays and Loops</h1>

        <script>
            const arr = [10, 20, 30]
            console.log(arr);
            console.log(arr[0]);
            arr[2] = 40;
            console.log(arr);

            console.log(arr.length);
            arr.push(100);
            console.log(arr);

            arr.splice(1, 2);
            console.log(arr);


        </script>
    </body>
</html>
